<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #box{
        display: flex;
        justify-content: center;
    }
    #gen-btn{
        border-radius: 1px solid rgb(0, 0, 0);
        border-radius: 10px;
        width: 200px;
        height: 50px;
    }
</style>
<body>
        <button id="gen-btn">Generate Qoute</button>
        <br></br>
        <p id="qoute-area"></p>

    <script>
        let qoutes = [
            "dont move",
            "dont give up",
            "smile please",
            "always give your best",
        ]
        document.getElementById("gen-btn").addEventListener("click", function(){
            let index = Math.floor(Math.random() * qoutes.length);
            document.getElementById("qoute-area").innerText = qoutes[index];
        })
    </script>
</body>
</html>
